name: CI

on:
  push:
    branches: [master]
  pull_request:
  # macOS is opt-in: on a free-plan private repo it burns minutes at 10x.
  workflow_dispatch:
    inputs:
      macos:
        description: "Also run the gate on macOS"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always
  # Snapshot tests must fail on mismatch, never rewrite snapshots in CI.
  INSTA_UPDATE: "no"

jobs:
  test:
    name: fmt + clippy + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  test-macos:
    name: fmt + clippy + test (macos)
    if: github.event_name == 'workflow_dispatch' && inputs.macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
