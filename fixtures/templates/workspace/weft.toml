[template]
name = "workspace"
weft-version = "0.1"
description = "A workspace that mounts the hello template as a service."

[[question]]
id = "workspace_name"
kind = "string"
prompt = "Workspace name"
example = "Acme Workspace"

[[include]]
name = "svc"
template = "../hello"
path = "services/hello"

[include.bind]
project_name = "workspace_name + ' Service'"

# A repeatable slot: the *project* declares connector instances
# (`--instance connector=github`, `weft instance add connector stripe`).
[[include]]
name = "connector"
template = "../hello"
path = "connectors/{key}"
repeat = true

[include.bind]
project_name = "key"
use_docker = "False"
